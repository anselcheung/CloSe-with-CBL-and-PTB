# Eval mode 5 — CloSeNet + PTB + BRM with SegFix post-processing (Phase 2 + Phase 3).
#   python evaluate_closenet_ckpts.py --config cfg/closenet_test_ptb_brm_postproc.yaml --ckpt <ptb_brm_checkpoint>.pt
# (or: sbatch evaluate_single.sbatch cfg/closenet_test_ptb_brm_postproc.yaml <ptb_brm_checkpoint>.pt)
# Same architecture as cfg/closenet_test_ptb_brm.yaml (aux heads + brm), but with
# post_processing enabled instead of disabled -- pairs with cfg/closenet_test_ptb_postproc.yaml
# for the non-BRM variants. Requires a PTB+BRM-trained checkpoint (i.e. trained with
# cfg/closenet_ptb_brm.yaml or cfg/closenet_ptb_brm_cbl.yaml -- CBL adds no forward-pass
# parameters, so this architecture is sufficient to reload either checkpoint).
model: closenet
device: cuda
debug: True
exp_logs_path: ./closenet_test_ptb_brm_postproc
optim:
  name: adam
  lr: 5.0e-3
  milestones: []
  gamma: 0.1
  weight_decay: 0.0
data:
  split_file: ./cfg/data_split_thuman.json
  data_path: ./data
  n_classes: 18
  pointcloud_samples: 2048
  num_workers: 0
  batch_size: 4
  input:
    - points
    - colors
    - normals
    - smpl
model_arch:
  garm_enc:
    name: attention_garm
    dropout: 0.0
    emb_dim: 64
    gar_emb_dim: 64
    key_mask: true
    max_norm: 2.0
    n_embeddings: 18
    n_heads: 4
  pc_enc:
    channels_sum: 192
    emb_dim: 1024
    inp_dim: 9
    k: 40
    name: dgcnn
    use_tnet: true
  part_enc:
    name: canon_encoder
  segm_dec:
    channels:
    - 512
    - 512
    - 512
    - 512
    - 256
    dropout: 0.5
    emb_dim: 512
    name: mlp
    segm_input: 1283
    slope: 0.2
  aux_heads:
    enabled: true
    boundary_channels: [256, 128]
    direction_channels: [256, 128]
  brm:
    enabled: true
    k: 6
    alpha: 1.0
    r_init: 0.05
training:
  batch_size: 16
  backup_it: -1
  loss_weights:
    segm_loss: 1.0
    boundary_loss: 3.0
    direction_loss: 0.3
  boundary_beta: 0.6
  dir_mask_dist: null
  max_epochs: 200
  max_iters: -1
  print_it: 200
  selection_metric: mIoU,freq_IoU,boundary_iou
  selection_mode: maximize
  val_it: 200
eval:
  boundary_radii: [0.0056, 0.014]
post_processing:
  enabled: true
  threshold: 0.7     # relabel points with predicted boundary prob above this
  step: null         # null => 2x median local point spacing, computed per cloud
  n_iters: 2
