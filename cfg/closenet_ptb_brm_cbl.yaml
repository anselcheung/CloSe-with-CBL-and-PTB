# CloSeNet + PTB (Phase 1 + Phase 2 BRM) + CBL: the auxiliary boundary/direction heads,
# the Boundary-aware Refinement Module (guided-propagation stand-in), and the Contrastive
# Boundary Loss on the (pre-BRM) decoder features, all combined. The three mechanisms are
# orthogonal -- CBL only adds a training-time loss on features (no new forward-pass
# parameters beyond BRM's), so this is just the union of closenet_ptb_brm.yaml's
# model_arch.brm block and closenet_ptb_cbl.yaml's training.cbl block. Requires scans
# processed by prep_boundaries.py (boundary/direction/boundary_dist fields).
#   python train_closenet.py cfg/closenet_ptb_brm_cbl.yaml
# Evaluate with cfg/closenet_test_ptb_brm.yaml (CBL adds no forward-pass parameters, so
# the BRM eval architecture is sufficient to reload the checkpoint).
model: closenet
device: cuda
debug: True
seed: 42               # RNG seed (train_closenet.py calls fix_seeds(seed))
exp_logs_path: ./closenet_ptb_brm_cbl_train
optim:
  name: adam
  lr: 5.0e-3
  milestones: []
  gamma: 0.1
  weight_decay: 0.0
data:
  split_file: ./cfg/data_split_thuman.json
  data_path: ./data
  n_classes: 18
  pointcloud_samples: 2048
  num_workers: 0
  batch_size: 4
  input:
    - points
    - colors
    - normals
    - smpl
model_arch:
  garm_enc:
    name: attention_garm
    dropout: 0.0
    emb_dim: 64
    gar_emb_dim: 64
    key_mask: true
    max_norm: 2.0
    n_embeddings: 18
    n_heads: 4
  pc_enc:
    channels_sum: 192
    emb_dim: 1024
    inp_dim: 9
    k: 40
    name: dgcnn
    use_tnet: true
  part_enc:
    name: canon_encoder
  segm_dec:
    channels:
    - 512
    - 512
    - 512
    - 512
    - 256
    dropout: 0.5
    emb_dim: 512
    name: mlp
    segm_input: 1283
    slope: 0.2
  aux_heads:
    enabled: true
    boundary_channels: [256, 128]
    direction_channels: [256, 128]
  brm:
    enabled: true
    k: 6
    alpha: 1.0
    r_init: 0.05
training:
  batch_size: 16
  backup_it: -1
  loss_weights:
    segm_loss: 1.0
    boundary_loss: 3.0
    direction_loss: 0.3
    cbl_loss: 0.1
  boundary_beta: 0.6      # up-weight of the (scarce) boundary class in boundary CE
  dir_mask_dist: null     # optional: drop direction loss for points closer than this to a boundary
  cbl:
    enabled: true
    k: 40
    radius: 0.1
    temperature: 1.0
  max_epochs: 50
  max_iters: -1
  print_it: 200
  selection_metric: mIoU,freq_IoU,boundary_iou
  selection_mode: maximize
  val_it: 200
eval:
  boundary_radii: [0.0056, 0.014]   # ~1cm / 2.5cm on a ~1.8m human in a unit bbox
